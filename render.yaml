# Render Blueprint: Live mode (Express server + built frontend + /live WebSocket).
# Keys are NOT stored here. Enter them in the Render dashboard (sync: false).
services:
  - type: web
    name: avatar-studios-live
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/integrations/status
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_MESA
        value: EXAVITQu4vr4xnSDxMaL
      - key: ELEVENLABS_VOICE_REED
        value: iP95p4xoKVk53GoZ742B
